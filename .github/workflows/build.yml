name: Native build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Qt ${{ matrix.qt-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        qt-version: [6.8.3]
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          modules: qtmultimedia
      - name: Configure
        run: cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build-native --config Debug --parallel
      - name: Test
        run: ctest --test-dir build-native -C Debug --output-on-failure
